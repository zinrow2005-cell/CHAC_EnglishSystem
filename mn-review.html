<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAC V63.9｜M–N 原始錄音核對</title>
<style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f6f7f8;color:#24334a;margin:auto;max-width:760px;padding:22px 16px;line-height:1.7}h1{font-size:24px}a,button{color:#15569b}audio{display:block;width:100%;margin:20px 0}button{padding:9px 12px;margin:3px;border:1px solid #bbc8d6;border-radius:10px;background:white;cursor:pointer}.note{background:#fff7e9;border:1px solid #eed7a6;padding:14px;border-radius:12px}textarea{width:100%;height:160px;font:inherit;box-sizing:border-box;border:1px solid #bbc8d6;border-radius:10px;padding:12px}small{color:#61718a}</style></head>
<body><p><a href="index.html">← 返回 A–N 字母課程</a></p><h1>M–N 老師原始錄音（待轉錄）</h1>
<div class="note"><strong>重要：這份錄音尚未得到可靠的逐字轉錄。</strong> 舊版 M–N 的 monkey／moon 等十個單字、短句及對應切點均屬推測，不能作為老師實際教學內容的證據。這裡只播放未改動的原始音檔，不再顯示猜測圖片或配對。</div>
<audio id="record" controls preload="metadata"><source src="audio/MN.m4a" type="audio/mp4">瀏覽器不支援音檔播放。</audio>
<p>跳轉原音大致位置（只分時間，不判定詞語）：</p>
<div id="jump"></div>
<h2>錄音核對備註（非自動轉錄）</h2><p><small>若你聽出單字或例句，可記在這裡；儲存只發生在此瀏覽器，不會更動正式教材。工具無法自行判斷聲音內容。</small></p>
<textarea id="notes" aria-label="原音備註" placeholder="依實際聽到的內容記錄，不必照舊字卡順序"></textarea>
<p><button id="save">儲存本機備註</button><button id="export">下載備註文字檔</button></p><p id="msg" role="status"></p>
<script>
const a=document.querySelector('#record'),j=document.querySelector('#jump'),n=document.querySelector('#notes'),msg=document.querySelector('#msg');
for(let s=0;s<=180;s+=15){const b=document.createElement('button');b.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');b.onclick=()=>{a.currentTime=s;a.play().catch(()=>{msg.textContent='播放未啟動。請先按播放器上的播放鍵。'})};j.appendChild(b)}
const key='chac-v638-mn-raw-audio-notes';try{n.value=localStorage.getItem(key)||''}catch(e){}
document.querySelector('#save').onclick=()=>{try{localStorage.setItem(key,n.value);msg.textContent='備註已儲存在這台裝置'}catch(e){msg.textContent='儲存失敗，請使用下載備註'}};
document.querySelector('#export').onclick=()=>{const blob=new Blob(['M–N 原音人工備註（非自動轉錄）\n\n'+n.value],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),e=document.createElement('a');e.href=url;e.download='CHAC_MN_原音核對備註.txt';e.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
a.addEventListener('error',()=>msg.textContent='音檔讀取失敗，請確認 GitHub 內有 audio/MN.m4a');
</script></body></html>
