<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAC H–J 分段校對 V2</title><style>
*{box-sizing:border-box}body{background:#f4f8fe;color:#294364;max-width:960px;margin:auto;padding:16px;font-family:system-ui,'Noto Sans TC',sans-serif}section{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #1232}h1{font-size:25px}p{line-height:1.65}.muted{font-size:13px;color:#64748b}button{cursor:pointer;min-height:43px;border:0;border-radius:10px;background:#326bd1;color:white;font-weight:700;padding:9px 13px;margin:3px}button.secondary{background:#e2eafa;color:#294364}button:disabled{opacity:.5}input,select,textarea{width:100%;padding:10px;border:1px solid #b8cce6;border-radius:9px;font:inherit}label{display:block;font-size:14px;font-weight:650}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.toolbar{display:flex;flex-wrap:wrap;align-items:center}audio{width:100%;margin-top:7px}.row{padding:10px;border:1px solid #e0e8f5;border-radius:10px;margin:8px 0}.row button{min-height:35px;padding:6px 9px}.warn{background:#fff5d9;padding:10px;border-radius:10px}textarea{min-height:100px}canvas{width:100%;height:115px;background:#f7faff;border-radius:8px}.pauses{display:flex;gap:4px;flex-wrap:wrap;max-height:135px;overflow:auto}.pauses button{background:#e0e9fa;color:#274465;padding:4px 8px;font-size:12px;min-height:30px} @media(max-width:550px){.grid{grid-template-columns:1fr}body{padding:8px}section{padding:13px}}
</style></head><body><h1>🖍️ CHAC H–J 老師錄音校對 V2</h1><p class="warn">本工具<strong>尚未自動逐字辨識</strong>老師的英文與中文。請以真正聽到的內容為準，確認每字母前兩個單字是一組，並找出第三個單字開始的時間。</p><section><h2>1. 聽錄音、看音量波形</h2><audio id="audio" controls preload="metadata" src="addons/PB1_HJ/audio/teacher_HJ.m4a"></audio><canvas id="wave" width="900" height="115" aria-label="音量波形"></canvas><div class="toolbar"><button onclick="move(-5)">−5秒</button><button onclick="move(-1)">−1秒</button><button onclick="move(-.25)">−0.25秒</button><button onclick="move(.25)">+0.25秒</button><button onclick="move(1)">+1秒</button><button onclick="move(5)">+5秒</button><b id="time">0.00秒</b></div><p class="muted">波形只代表音量大小，不能代表老師真正念的單字；下方停頓點僅是候選。</p><div id="pauses" class="pauses"></div></section><section><h2>2. 建立一組已聽過的片段</h2><div class="grid"><label>字母<select id="letter"><option>H</option><option>I</option><option>J</option></select></label><label>類別<select id="type"><option value="pair">前兩字共同教學</option><option value="single">單字獨立教學</option></select></label><label>名稱／英文字<input id="name" placeholder="必須依老師錄音核對"></label><label>中文意思<input id="zh" placeholder="核對後填入"></label><label>開始秒數<input id="start" type="number" step=".01" min="0" value="0"></label><label>結束秒數<input id="end" type="number" step=".01" min="0" value="10"></label></div><div class="toolbar"><button class="secondary" onclick="bound('start')">目前位置設起點</button><button class="secondary" onclick="bound('end')">目前位置設終點</button><button onclick="playSegment()">▶ 預聽這一段</button><button class="secondary" onclick="boundary('start')">聽開頭 2 秒</button><button class="secondary" onclick="boundary('end')">聽結尾 2 秒</button></div><label>老師實際講的英文、短句、中文說明<textarea id="transcript" placeholder="未核實的內容不要猜測"></textarea></label><label>校對狀態<select id="status"><option value="draft">候選／未核實</option><option value="checked">已聽過、仍待校對</option><option value="confirmed">已核對內容與前後邊界</option></select></label><div class="toolbar"><button onclick="save()">儲存／更新這一段</button><button class="secondary" onclick="resetEditor()">新增下一段</button></div><p id="msg" class="muted"></p></section><section><h2>3. 校對清單與資料匯出</h2><p class="muted">可點編輯或預聽；資料先儲存於本機瀏覽器。請另外匯出 JSON，避免清理瀏覽器資料後遺失。</p><div id="list"></div><div class="toolbar"><button onclick="download()">下載校對 JSON</button><label style="display:inline-block"><input id="import" type="file" accept=".json,application/json" style="max-width:235px"></label></div></section><script>
const $=id=>document.getElementById(id),a=$('audio'),D=184.11,key='chac-hj-review-v2';let items=[],editing=-1,cut=null,stops=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch{};
function persist(){localStorage.setItem(key,JSON.stringify(items));list()};function move(s){a.currentTime=Math.max(0,Math.min(D,a.currentTime+s))};function bound(id){$(id).value=a.currentTime.toFixed(2)};function play(s,e){if(!(e>s&&s>=0&&e<=D)){alert('請檢查秒數');return}cut=e;a.currentTime=s;const p=a.play();if(p&&p.catch)p.catch(()=>alert('播放失敗，請確認錄音檔已解壓縮'))};function playSegment(){play(+$('start').value,+$('end').value)};function boundary(what){let s=+$('start').value,e=+$('end').value;what==='start'?play(s,Math.min(s+2,e)):play(Math.max(s,e-2),e)};
a.addEventListener('timeupdate',()=>{$('time').textContent=a.currentTime.toFixed(2)+' 秒';if(cut!==null&&a.currentTime>=cut){a.pause();cut=null}drawWave()});a.addEventListener('seeked',drawWave);
function record(){return {letter:$('letter').value,type:$('type').value,name:$('name').value.trim(),zh:$('zh').value.trim(),start:+$('start').value,end:+$('end').value,transcript:$('transcript').value.trim(),status:$('status').value}};
function save(){const v=record();if(!v.name||!(v.end>v.start)||v.start<0||v.end>D){alert('請填名稱和有效時間');return}if(v.status==='confirmed'&&!v.transcript){alert('已確認片段須有實際聽寫內容');return}if(editing<0)items.push(v);else items[editing]=v;persist();$('msg').textContent='已儲存。請匯出 JSON 備份。';editing=-1}
function fill(i){editing=i;const x=items[i];for(let k of ['letter','type','name','zh','start','end','transcript','status'])$(k).value=x[k]??'';window.scrollTo({top:340,behavior:'smooth'})};function resetEditor(){editing=-1;for(let k of ['name','zh','transcript'])$(k).value='';$('status').value='draft'};
function list(){const r=$('list');r.replaceChildren();items.forEach((x,i)=>{const d=document.createElement('div');d.className='row';const p=document.createElement('div');p.textContent=`${i+1}. ${x.letter} | ${x.name} | ${x.start}–${x.end}秒 | ${x.type==='pair'?'前兩字共同教學':'獨立'} | ${x.status}`;d.append(p);for(const [t,fn] of [['預聽',()=>play(x.start,x.end)],['編輯',()=>fill(i)],['刪除',()=>{if(confirm('確定刪除？')){items.splice(i,1);persist()}}]]){const b=document.createElement('button');b.textContent=t;b.className='secondary';b.onclick=fn;d.appendChild(b)}r.appendChild(d)})};function download(){const obj={format:'CHAC_HJ_review_v2',verifiedByASR:false,audio:'addons/PB1_HJ/audio/teacher_HJ.m4a',segments:items};const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const el=document.createElement('a');el.href=u;el.download='CHAC_HJ_segments_review.json';el.click();setTimeout(()=>URL.revokeObjectURL(u),1500)};
$('import').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!Array.isArray(o.segments))throw Error('格式不正確');items=o.segments;persist();$('msg').textContent='已匯入 '+items.length+' 段'}catch(err){alert('匯入失敗：'+err.message)}};
fetch('addons/PB1_HJ/pause_candidates.json').then(r=>r.json()).then(o=>{stops=o.pause_candidates||[];for(const [s,e] of stops){const b=document.createElement('button');b.textContent=s.toFixed(1)+'s';b.onclick=()=>{a.currentTime=s};$('pauses').append(b)}drawWave()}).catch(()=>{});
// Draw a timeline with silence candidates. This is NOT a true acoustic waveform.
function drawWave(){const c=$('wave'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#dbe8fa';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#f6f9fd';for(const [s,e] of stops){const x=s/D*c.width,w=Math.max(2,(e-s)/D*c.width);ctx.fillRect(x,0,w,c.height)}ctx.strokeStyle='#8ea9ca';ctx.beginPath();ctx.moveTo(0,57);ctx.lineTo(c.width,57);ctx.stroke();ctx.fillStyle='#236bd6';ctx.fillRect(a.currentTime/D*c.width-1,0,2,c.height);ctx.fillStyle='#244260';ctx.font='13px system-ui';for(let t=0;t<=180;t+=30)ctx.fillText(t+'s',t/D*c.width+3,110)};$('wave').onclick=e=>{const rect=$('wave').getBoundingClientRect();a.currentTime=Math.min(D,Math.max(0,(e.clientX-rect.left)/rect.width*D))};list();drawWave();
</script></body></html>
